<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel=manifest href=manifest.webmanifest><meta name=theme-color content="#2F4FE0"><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content=HomeHub><link rel=apple-touch-icon href=icon-192.png><link rel=icon href=icon-192.png><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HomeHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail + one content column on desktop, bottom tabs on phones; panels hold lists, never nested cards */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#141B26; --ink-2:#4B5668; --line:#DADFE8;
  --accent:#2F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E3E8FC;
  --good:#16774A; --good-soft:#DCF2E7; --warn:#8F5600; --warn-soft:#FFEFCF; --bad:#B3261E; --bad-soft:#FDE2DF;
  --scrim:rgba(14,19,27,.45); --ev-task:#17806F; --ev-bill:#B7791F; --ev-event:#C2306B; --ev-meal:#5B7F1F; --ev-fix:#5C6B8A;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --surface-2:#1C2531; --ink:#E8ECF3; --ink-2:#A3AEC0; --line:#2A3546;
  --accent:#8196FF; --accent-ink:#0E131B; --accent-soft:#222C57;
  --good:#5FD39A; --good-soft:#14301F; --warn:#F2B24D; --warn-soft:#38290C; --bad:#FF8F86; --bad-soft:#3A1816;
  --scrim:rgba(0,0,0,.6); --ev-task:#4FD1B5; --ev-bill:#F2B24D; --ev-event:#FF86B1; --ev-meal:#A5D663; --ev-fix:#9DB0D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1C2531; --ink:#E8ECF3; --ink-2:#A3AEC0; --line:#2A3546;
  --accent:#8196FF; --accent-ink:#0E131B; --accent-soft:#222C57;
  --good:#5FD39A; --good-soft:#14301F; --warn:#F2B24D; --warn-soft:#38290C; --bad:#FF8F86; --bad-soft:#3A1816;
  --scrim:rgba(0,0,0,.6); --ev-task:#4FD1B5; --ev-bill:#F2B24D; --ev-event:#FF86B1; --ev-meal:#A5D663; --ev-fix:#9DB0D6; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ic{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);padding-block:12px 96px}
.main{min-width:0}
.rail{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 16px}
.top .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.top h1{font-size:28px;line-height:1.1}
.top-actions{display:flex;align-items:center;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 4px;font-size:11px;font-weight:600;color:var(--ink-2);border-radius:10px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .shell{grid-template-columns:232px minmax(0,1fr);column-gap:32px;padding-block:28px 48px}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(28px + env(safe-area-inset-top,0px));align-self:start}
  .tabs{display:none}
}
.rail-nav{display:flex;flex-direction:column;gap:2px}
.rail-link{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.rail-link:hover{background:var(--surface)}
.rail-link[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rail-link[aria-current="page"] .ic{color:var(--accent)}
.brand-row{display:flex;gap:12px;align-items:center}
.brand-row .nm{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15}
.brand-row .ty{font-size:12px;color:var(--ink-2)}
.plate{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;
  box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--ink-2);overflow:hidden;flex:none}
.plate img{width:100%;height:100%;object-fit:cover}
.me-chip{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.me-chip .l1{font-weight:600;font-size:14px;line-height:1.2}
.me-chip .l2{font-size:12px;color:var(--ink-2)}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel-h h2{font-size:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:2px 0}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;overflow:hidden;flex:none;font-family:var(--font-body)}
.av img{width:100%;height:100%;object-fit:cover}
.stackav{display:inline-flex}
.stackav .av{box-shadow:0 0 0 2px var(--surface);margin-left:-8px}
.stackav .av:first-child{margin-left:0}
.hint{font-size:13px;color:var(--ink-2)}
.empty{padding:22px 8px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:16px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.plain{background:var(--surface-2);border:1px solid var(--line)}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-2);background:transparent;display:grid;place-items:center;color:transparent;margin-top:1px;padding:0}
.check:hover:not([disabled]){border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check[disabled]{opacity:.45;cursor:not-allowed}
.task-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px}
.t-title{font-weight:600;overflow-wrap:anywhere}
.done .t-title{text-decoration:line-through;color:var(--ink-2)}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin:18px 0 2px}
.group-h:first-child{margin-top:0}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .seg{max-width:100%}
.act{display:flex;gap:10px;padding:9px 0;align-items:flex-start;font-size:14px}
.act .when{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap;padding-left:8px}

/* routines */
.rt-time{font-family:var(--font-mono);font-size:22px;font-weight:500;letter-spacing:-.02em;min-width:64px}
.rt{display:flex;gap:14px;align-items:center;padding:12px 0}
.rt .grow{flex:1;min-width:0}
.rt .nm{font-weight:600}
.days{display:flex;gap:3px}
.days span{width:20px;height:20px;border-radius:6px;font-size:11px;display:grid;place-items:center;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.days span.on{background:var(--accent-soft);color:var(--accent)}
.rt-card{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step input{width:22px;height:22px;accent-color:var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.form{display:flex;flex-direction:column;gap:14px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;background:var(--surface);font-weight:500;cursor:pointer}
.pick input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.pick.sq{border-radius:10px;padding:6px 10px}
.err{color:var(--bad);font-size:14px;min-height:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:44px;height:26px;accent-color:var(--accent)}
.switch .tx{min-width:0}
.switch .tt{font-weight:600}

/* people */
.mcard{display:flex;gap:12px;align-items:center;padding:12px 0}
.mcard .grow{flex:1;min-width:0}
.mcard .nm{font-weight:600}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.status-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;font-weight:500}
.status-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border-top:0}
.invite{display:flex;gap:10px;align-items:center;padding:10px 0;flex-wrap:wrap}
.invite code{font-family:var(--font-mono);font-weight:500;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;user-select:all}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:86vh;border-radius:18px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:21px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;overflow-wrap:anywhere}
.hist{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hist div{display:flex;gap:10px;justify-content:space-between}
.notif{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.notif:first-child{border-top:0}
.notif.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.notif:not(.unread)::before{content:"";width:8px;flex:none}
.toasts{position:fixed;z-index:60;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding-inline:16px}
@media (min-width:900px){.toasts{bottom:24px;align-items:flex-end;padding-right:max(24px,env(safe-area-inset-right,0px))}}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cal-title{font-size:20px;flex:1;min-width:150px;text-align:center}
@media (min-width:700px){.cal-title{flex:none;text-align:left}}
.layers{display:flex;gap:8px;flex-wrap:wrap}
.evdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.t-routine{background:var(--accent)}.t-task{background:var(--ev-task)}.t-bill{background:var(--ev-bill)}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-dow{background:var(--surface-2);padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.cal-cell{background:var(--surface);border:0;border-radius:0;padding:6px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:left;min-width:0}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.other{background:var(--surface-2);color:var(--ink-2)}
.cal-cell .dn{font-family:var(--font-mono);font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal-cell.today .dn{background:var(--accent);color:var(--accent-ink);font-weight:500}
.cal-cell .pills{display:none;flex-direction:column;gap:2px;width:100%;min-width:0}
.cal-cell .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.pill-ev{display:flex;align-items:center;gap:5px;font-size:11px;min-width:0;width:100%}
.pill-ev .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cal-cell .more{font-size:11px;color:var(--ink-2)}
@media (min-width:900px){.cal-cell{align-items:flex-start;min-height:112px;padding:6px 8px}.cal-cell .pills{display:flex}.cal-cell .dots{display:none}}
.wk{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.wk{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.wk-day{padding:10px}}
.wk-day.today{box-shadow:0 0 0 2px var(--accent)}
.wk-h{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0 0 8px;width:100%;text-align:left}
.wk-h .wn{font-family:var(--font-display);font-weight:700;font-size:22px}
.evlist{display:flex;flex-direction:column;gap:2px}
.ev{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:6px 4px;text-align:left;width:100%;min-width:0}
.ev:hover{background:var(--surface-2)}
.ev .evtime{font-size:12px;color:var(--ink-2);min-width:38px}
.ev .evtime:empty{display:none}
.ev .evbody{display:flex;flex-direction:column;min-width:0;flex:1}
.ev .evtitle{overflow-wrap:anywhere;font-size:14px}
.ev.is-done .evtitle{text-decoration:line-through;color:var(--ink-2)}
.ev.big{padding:12px 6px;border-top:1px solid var(--line);border-radius:0;gap:12px}
.ev.big .evtitle{font-size:15px;font-weight:600}
.ev.big .evtime{font-size:15px;min-width:52px}
.evlist .ev.big:first-child{border-top:0}
/* supplies & money */
.inv,.bill{display:flex;gap:12px;align-items:center;padding:12px 0;flex-wrap:wrap}
.inv .task-main,.bill .task-main{flex:1;min-width:180px}
.qty-ctl{display:flex;align-items:center;gap:6px}
.stepbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.stepbtn:hover{background:var(--surface-2)}
.qty{min-width:62px;text-align:center;font-size:18px;font-weight:500;display:flex;flex-direction:column;line-height:1.1}
.qty small{font-size:11px;color:var(--ink-2);font-family:var(--font-body)}
.bill-r{display:flex;align-items:center;gap:12px;margin-left:auto}
.amt{font-size:17px;font-weight:500}

function seed(){

/* ---------- accessors ---------- */
function me(){return S.members.filter(function(m){return m.id===S.me})[0]}

function P(k){var m=me();return !!(m&&PERMS[m.role]&&PERMS[m.role][k])}

function initials(n){return String(n).trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}
function sinfo(k){return STATUSES.filter(function(s){return s.k===k})[0]||STATUSES[1]}

function avatar(m,sz){sz=sz||32;if(!m)return '';
 if(m.image)return '<span class="av" style="width:'+sz+'px;height:'+sz+'px"><img alt="" src="'+esc(m.image)+'"></span>';
 return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;background:'+COLORS[m.color%COLORS.length]+';font-size:'+Math.round(sz*.38)+'px">'+esc(initials(m.name))+'</span>'}

/* ---------- time ---------- */
function dueAt(t){return t.dueDate?new Date(t.dueDate+'T'+(t.dueTime||'23:59')):null}

function fmtDue(t){var d=new Date(t.dueDate+'T00:00'),diff=Math.round((d-startOfDay(new Date()))/864e5);
 var s=diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
 return t.dueTime?s+' '+t.dueTime:s}
function fmtTs(ts){return new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function ago(ts){var m=Math.round((Date.now()-ts)/6e4);if(m<1)return 'now';if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<24)return h+' h ago';var d=Math.round(h/24);return d+' d ago'}

function nextDue(t){var d=new Date(t.dueDate+'T00:00'),today=startOfDay(new Date());
 var step=function(){if(t.recur==='daily')d.setDate(d.getDate()+1);else if(t.recur==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1)};
 step();var guard=0;while(d<today&&guard++<400)step();return ymd(d)}
function completeTask(t){p3TaskDone(t);
 t.status='done';t.completedAt=Date.now();t.completedBy=S.me;hist(t,'Marked done');logAct(first(me().name)+' completed “'+t.title+'”');

function targets(r){return r.who&&r.who.length?r.who.filter(function(i){return mb(i)}):S.members.filter(function(m){return m.role!=='guest'}).map(function(m){return m.id})}
function routineState(r){var n=new Date(),today=ymd(n);
 if(r.active===false)return {k:'off',l:'Paused',c:''};
 var run=getRun(r.id,today);
 if(run.completed)return {k:'done',l:'Done today',c:'good'};
 if(r.days.indexOf(n.getDay())<0)return {k:'skip',l:'Not today',c:''};
 var nm=n.getHours()*60+n.getMinutes(),rm=minOf(r.time);
 if(nm<rm)return {k:'soon',l:'Upcoming',c:''};

function tick(){
 var n=new Date(),today=ymd(n),nm=n.getHours()*60+n.getMinutes(),changed=false;
 if(S.household&&S.household.modules.routines){

/* ---------- modals ---------- */
function openTask(id){openModal(function(){return taskDetail(id)},true)}
function taskDetail(id){var t=tk(id);if(!t)return mHead('Task')+'<p>This task no longer exists.</p>';
 var done=t.status==='done',canEdit=P('assign'),canDel=P('settings')||t.createdBy===S.me&&P('create');
 var rem={'':'None','0':'At the due time','15':'15 minutes before','60':'1 hour before','1440':'1 day before'}[t.reminder];
 return mHead(t.title)+'<div class="row" style="margin-bottom:12px">'+(done?'<span class="chip good">Done</span>':'<span class="chip accent">Open</span>')+
 (t.priority==='high'?'<span class="chip bad">'+icon('flag',12)+'High priority</span>':'<span class="chip">'+({med:'Medium',low:'Low'}[t.priority])+' priority</span>')+'</div>'+
 (t.desc?'<p style="margin-bottom:12px">'+esc(t.desc)+'</p>':'')+
 '<dl class="kv"><dt>Assigned to</dt><dd>'+esc(assigneeLabel(t))+'</dd><dt>Due</dt><dd>'+(t.dueDate?esc(fmtDue(t)):'No date')+'</dd><dt>Repeats</dt><dd>'+(t.recur==='none'?'Does not repeat':esc(t.recur))+'</dd><dt>Reminder</dt><dd>'+esc(rem||'None')+'</dd>'+p3TaskRefs(t)+(t.notes?'<dt>Notes</dt><dd>'+esc(t.notes)+'</dd>':'')+'</dl>'+
 '<div class="group-h" style="margin-top:18px">History</div><div class="hist">'+t.history.slice().reverse().map(function(x){var m=mb(x.who);return '<div><span>'+esc(x.text)+(m?' · '+esc(first(m.name)):'')+'</span><span class="mono">'+esc(fmtTs(x.ts))+'</span></div>'}).join('')+'</div>'+
 '<div class="sheet-actions">'+(canDel?'<button type="button" class="btn danger" data-act="delete-task" data-id="'+t.id+'" style="margin-right:auto">'+(UI.confirm==='del'+t.id?'Tap again to delete':'Delete')+'</button>':'')+
 (canEdit?'<button type="button" class="btn" data-act="edit-task" data-id="'+t.id+'">'+icon('edit',16)+'Edit</button>':'')+
 (!done&&t.assign.mode==='claimable'&&P('complete')?'<button type="button" class="btn" data-act="claim-task" data-id="'+t.id+'">Claim this task</button>':'')+
 (canComplete(t)?'<button type="button" class="btn primary" data-act="toggle-task" data-id="'+t.id+'">'+(done?'Reopen':'Mark done')+'</button>':'')+'</div>'}

function openRun(id){openModal(function(){return runView(id)},true)}
function runView(id){var r=rt(id);if(!r)return mHead('Routine')+'<p>This routine no longer exists.</p>';

 '<div class="hint" style="margin-top:10px">This is a reminder checklist. HomeHub does not operate devices.</div>'}

 '<div class="field"><label for="r-steps">Steps, one per line</label><textarea id="r-steps" name="steps" style="min-height:110px" placeholder="Front door&#10;Back door">'+esc(r.steps.join('\n'))+'</textarea></div>'+
 '<div class="field"><span class="lbl">Who gets the reminder</span><div class="pickrow"><label class="pick sq"><input type="radio" name="who" value="everyone"'+(every?' checked':'')+'>Everyone</label><label class="pick sq"><input type="radio" name="who" value="selected"'+(every?'':' checked')+'>Selected people</label></div></div>'+
 '<div class="field" id="who-pick">'+memberPicks(r.who||[],'whoids')+'</div>'+
 '<div class="err" id="form-err" role="alert"></div><div class="sheet-actions">'+(id?'<button type="button" class="btn danger" data-act="delete-routine" data-id="'+id+'" style="margin-right:auto">'+(UI.confirm==='delr'+id?'Tap again to delete':'Delete')+'</button>':'')+
 '<button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">'+(id?'Save changes':'Add routine')+'</button></div></form>'}

function notifView(){var l=S.notifs.filter(function(n){return n.to===S.me}).slice(0,40);
 return mHead('Notifications')+(l.length?'<div>'+l.map(function(n){return '<div class="notif'+(n.read?'':' unread')+'"><div style="flex:1;min-width:0"><div>'+esc(n.text)+'</div><div class="hint mono">'+esc(fmtTs(n.ts))+'</div></div></div>'}).join('')+'</div><div class="sheet-actions"><button type="button" class="btn" data-act="read-all">Mark all read</button></div>':'<div class="empty"><strong>No notifications</strong>Task assignments, deadlines and routine reminders show up here.</div>')}

/* ---------- images ---------- */
function readImage(file,size){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
 var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d'),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;x.drawImage(im,sx,sy,s,s,0,0,size,size);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
 switch(a){
 case 'go':closeModal();UI.view=el.getAttribute('data-view');render();window.scrollTo(0,0);break;
 case 'close-modal':closeModal();break;
 case 'toast-act':if(toastFns[id]){var f=toastFns[id];el.closest('.toast').remove();delete toastFns[id];f()}break;
 case 'dismiss-banner':S.sample=false;commit();break;
 case 'filter':UI.tf=el.getAttribute('data-f');render();break;
 case 'open-task':openTask(id);break;
 case 'new-task':if(P('create'))openModal(function(){return taskForm('')});syncForm();break;
 case 'edit-task':if(P('assign'))openModal(function(){return taskForm(id)});syncForm();break;
 case 'toggle-task':{var t=tk(id);if(t&&canComplete(t)){if(t.status==='open')completeTask(t);else reopenTask(t);commit()}break}
 case 'claim-task':{var t2=tk(id);if(t2&&t2.assign.mode==='claimable'&&P('complete')){t2.assign={mode:'members',ids:[S.me]};hist(t2,'Claimed');logAct(first(me().name)+' claimed “'+t2.title+'”');commit();toast('You claimed “'+t2.title+'”')}break}
 case 'delete-task':{var t3=tk(id);if(!t3)break;if(UI.confirm==='del'+id){p3TaskDeleted(t3);S.tasks=S.tasks.filter(function(x){return x.id!==id});logAct(first(me().name)+' deleted “'+t3.title+'”');closeModal();commit()}else{UI.confirm='del'+id;refreshModal()}break}
 case 'open-routine':openRun(id);break;
 case 'new-routine':if(P('routines')){openModal(function(){return routineForm('')});syncForm()}break;
 case 'edit-routine':if(P('routines')){openModal(function(){return routineForm(id)});syncForm()}break;
 case 'toggle-routine':{var r=rt(id);if(r&&P('routines')){r.active=r.active===false;logAct(first(me().name)+(r.active?' resumed ':' paused ')+r.name);commit()}break}
 case 'delete-routine':{var r2=rt(id);if(!r2)break;if(UI.confirm==='delr'+id){S.routines=S.routines.filter(function(x){return x.id!==id});logAct(first(me().name)+' deleted the routine '+r2.name);closeModal();commit()}else{UI.confirm='delr'+id;openModal(function(){return routineForm(id)});syncForm()}break}
 case 'set-status':{var m=me();m.status=el.getAttribute('data-k');logAct(first(m.name)+' is now: '+sinfo(m.status).l.toLowerCase());commit();break}
 case 'bell':openModal(notifView,true);break;
 case 'read-all':S.notifs.forEach(function(n){if(n.to===S.me)n.read=true});commit();break;
 case 'account':openModal(accountView,true);break;
 case 'edit-profile':openModal(profileForm);break;
 case 'switch-member':if(CLOUD.on){toast('Each person signs in with their own account.');break}S.me=id;UI.view='home';closeModal();commit();break;
 case 'signout':if(CLOUD.on){closeModal();cloudSignOut();break}S.me=null;closeModal();commit();break;
 case 'manage-member':openModal(function(){return manageView(id)},true);break;
 case 'remove-member':if(UI.confirm==='rm'+id){var rm=mb(id);S.members=S.members.filter(function(x){return x.id!==id});S.tasks.forEach(function(t){if(t.assign.mode==='members')t.assign.ids=t.assign.ids.filter(function(i){return i!==id})});
   logAct(first(me().name)+' removed '+(rm?first(rm.name):'a member'));closeModal();commit()}else{UI.confirm='rm'+id;refreshModal();openModal(function(){return manageView(id)},true)}break;
 case 'copy-invite':{var code=el.getAttribute('data-code');var ok=function(){toast('Copied '+code)},bad=function(){toast('Copy is blocked here. Select the code and copy it.')};
  try{navigator.clipboard.writeText(code).then(ok,bad)}catch(err){bad()}break}
 case 'revoke-invite':S.invites=S.invites.filter(function(i){return i.code!==el.getAttribute('data-code')});commit();break;
 case 'reset-sample':{var keep=S;S=seed();UI.view='home';commit();toast('Example household restored');break}
 case 'erase':if(CLOUD.on){toast('Deleting the shared household is not available online. Use Sign out.');break}if(UI.confirm==='erase'){try{localStorage.removeItem(KEY)}catch(x){}S=emptyState();UI.confirm='';UI.wtab='create';commit()}else{UI.confirm='erase';render()}break;
 case 'wtab':UI.wtab=el.getAttribute('data-t');render();break;
 case 'pick-signin':if(CLOUD.on)break;S.me=id;UI.view='home';commit();break;
 default:p2Click(a,el,id);break;
 case 'clear-photo':UI.pending='';{var pv=$('#photo-prev');if(pv){var tgt=document.querySelector('[data-photo]').getAttribute('data-photo');pv.innerHTML=tgt==='household'?'<span class="plate">'+esc(initials((document.querySelector('#hh-name')||{}).value||S.household.name))+'</span>':avatar({name:me().name,color:me().color,image:''},56)}}break;
 }
});

/* show or hide the pickers that depend on a radio choice */
function syncForm(){var f=document.querySelector('#modal-root form');if(!f)return;
 var mode=f.querySelector('input[name=mode]:checked'),pp=$('#people-pick');if(mode&&pp)pp.hidden=mode.value!=='members';
 var who=f.querySelector('input[name=who]:checked'),wp=$('#who-pick');if(who&&wp)wp.hidden=who.value!=='selected';p2Sync(f)}

document.addEventListener('change',function(e){var t=e.target;if(p2Change(e))return;
 if(t.matches('input[name=mode],input[name=who],input[name=split],input[name=cmode],input[name=kind],select[name=freq],select[name=mtype],select[name=convto],select[name=scat]'))syncForm();
 if(t.id==='vis'){me().vis=t.value;commit()}
 if(t.hasAttribute&&t.hasAttribute('data-pref')){me().prefs[t.getAttribute('data-pref')]=t.checked;save()}
 if(t.hasAttribute&&t.hasAttribute('data-module')){S.household.modules[t.getAttribute('data-module')]=t.checked;logAct(first(me().name)+(t.checked?' turned on ':' turned off ')+'the '+t.getAttribute('data-module')+' module');commit()}
 if(t.hasAttribute&&t.hasAttribute('data-step')){var r=rt(t.getAttribute('data-id'));if(!r||!P('runRoutine'))return;var run=getRun(r.id,ymd(new Date())),i=+t.getAttribute('data-step'),was=run.completed;
  var ix=run.done.indexOf(i);if(t.checked&&ix<0)run.done.push(i);if(!t.checked&&ix>-1)run.done.splice(ix,1);
  run.completed=r.steps.every(function(_,k){return run.done.indexOf(k)>-1});
  if(run.completed&&!was){logAct(first(me().name)+' finished “'+r.name+'”');toast(r.name+' is done for today')}commit()}
 if(t.matches&&t.matches('input[type=file][data-photo]')&&t.files&&t.files[0]){var kind=t.getAttribute('data-photo');
  readImage(t.files[0],kind==='household'?200:160).then(function(url){UI.pending=url;var pv=$('#photo-prev');if(pv)pv.innerHTML=kind==='household'?'<span class="plate"><img alt="" src="'+url+'"></span>':avatar({name:'',color:0,image:url},56)}).catch(function(){toast('That image could not be read. Try a JPG or PNG.')})}
});
document.addEventListener('input',function(e){if(e.target.id==='tq'){UI.q=e.target.value;var l=$('#task-list');if(l)l.innerHTML=taskListHtml()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal-root .sheet'))closeModal()});

function fail(msg){var el=$('#form-err');if(el)el.textContent=msg}
document.addEventListener('submit',function(e){var f=e.target;if(!f.getAttribute||!f.getAttribute('data-form'))return;e.preventDefault();
 var kind=f.getAttribute('data-form'),fd=new FormData(f),id=f.getAttribute('data-id');
 if(p2Submit(kind,fd,id))return;
 if(kind==='create'){
  var you=(fd.get('you')||'').trim(),hh=(fd.get('hh')||'').trim();if(!you||!hh)return fail('Enter your name and a household name.');
  var s=emptyState(),mid='m_'+uid();s.household={id:uid(),name:hh,type:fd.get('type'),image:'',modules:{tasks:true,routines:true,inventory:true,bills:true,events:true,cleaning:true,meals:true,suggestions:true,announcements:true},currency:'ZMW',autoAdd:true,created:Date.now()};
  s.members=[mkMember(mid,you,'admin',0,'home')];s.me=mid;S=s;
  if(fd.get('starter')){var all=[0,1,2,3,4,5,6];S.routines=[mkRoutine('Lock up for the night','21:00',all,['Front door','Back door','All windows']),mkRoutine('Bedtime check','21:30',all,['Lights off','Charge phones','Set alarms'])]}
  logAct(first(you)+' created '+hh);UI.view='home';UI.wtab='signin';commit();toast('Welcome to '+hh+'. Invite people from the Household tab.');return}
 if(kind==='join'){

function expInfo(it){if(!it.exp)return null;var diff=Math.round((parseD(it.exp)-startOfDay(new Date()))/864e5);
 if(diff<0)return {c:'bad',l:'Expired '+(-diff)+' d ago',d:diff};if(diff===0)return {c:'bad',l:'Expires today',d:0};if(diff<=7)return {c:'warn',l:'Expires in '+diff+' d',d:diff};
 return {c:'',l:'Expires '+parseD(it.exp).toLocaleDateString(undefined,{day:'numeric',month:'short'}),d:diff}}
function lowCheck(it){if(!S.household.autoAdd||!isLow(it))return false;
 if(S.groceries.some(function(g){return g.status==='open'&&g.invId===it.id}))return false;
 var need=Math.max(1,Math.ceil((it.min*2-it.qty)*10)/10);
 S.groceries.push({id:uid(),name:it.name,qty:need,unit:it.unit,cat:it.cat,shopper:'',status:'open',invId:it.id,auto:true,addedBy:S.me,added:Date.now(),boughtAt:0,boughtBy:null});
 logAct(it.name+' is '+(it.qty<=0?'out of stock':'running low')+' and was added to the shopping list');
 S.members.filter(function(m){return m.id!==S.me&&(m.role==='admin'||m.role==='member')}).forEach(function(m){notify(m.id,it.name+' is '+(it.qty<=0?'out of stock':'running low')+'. Added to the shopping list.','grocery',it.id)});
 toast(it.name+' added to the shopping list');return true}
function adjustInv(it,delta,kind){var before=it.qty;it.qty=Math.max(0,Math.round((it.qty+delta)*100)/100);var a=Math.round(Math.abs(it.qty-before)*100)/100;if(!a)return;
 it.history.push({ts:Date.now(),who:S.me,text:{used:'Used',bought:'Bought',discard:'Discarded'}[kind]+' '+fq(a)+' '+it.unit});
 logAct(first(me().name)+' '+{used:'used',bought:'bought',discard:'discarded'}[kind]+' '+fq(a)+' '+it.unit+' of '+it.name);lowCheck(it)}
function stepOf(u){return u==='kg'||u==='L'?0.5:1}

  (can?'<div class="row" style="gap:6px"><button type="button" class="btn sm primary" data-act="approve-sug" data-id="'+g.id+'">Add</button><button type="button" class="btn sm" data-act="decline-sug" data-id="'+g.id+'">Decline</button></div>':'')+'</div></li>'}).join('')+'</ul></section>';

 h+='<section class="panel">';

 Object.keys(cats).sort().forEach(function(c){h+='<div class="group-h">'+esc(c)+'</div><ul class="list">'+cats[c].map(grocRow).join('')+'</ul>'});
 h+='</section>';
 h+='<div style="margin-top:14px"><button type="button" class="link" data-act="hist-toggle">'+(UI.hist?'Hide':'Show')+' shopping history</button></div>';
 if(UI.hist)h+='<section class="panel" style="margin-top:8px">'+(done.length?'<ul class="list">'+done.map(function(g){var m=mb(g.boughtBy);return '<li><div class="act">'+avatar(m,24)+'<span>'+esc(g.name)+' <span class="hint mono">'+fq(g.qty)+' '+esc(g.unit)+'</span></span><span class="when">'+(m?esc(first(m.name))+' · ':'')+ago(g.boughtAt)+'</span>'+(can?'<button type="button" class="link" data-act="undo-buy" data-id="'+g.id+'" style="margin-left:8px">Undo</button>':'')+'</div></li>'}).join('')+'</ul>':'<div class="empty">Bought items are listed here.</div>')+'</section>';

 (sh?avatar(sh,20)+'<span class="hint">'+esc(first(sh.name))+' is buying</span>':'<span class="hint">Anyone can buy</span>')+'</span></button></div></li>'}
function invHtml(){var q=UI.invq.trim().toLowerCase(),f=UI.invf;
 var all=S.inventory,low=all.filter(isLow),exp=all.filter(function(i){var e=expInfo(i);return e&&e.d<=7});
 var list=all.filter(function(i){if(f==='low'&&!isLow(i))return false;if(f==='exp'){var e=expInfo(i);if(!(e&&e.d<=7))return false}return !q||(i.name+' '+i.cat+' '+i.loc).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (isLow(b)-isLow(a))||a.name.localeCompare(b.name)});
 return '<div class="toolbar">'+seg([['all','All',all.length],['low','Low',low.length],['exp','Expiring',exp.length]],'invf',f)+'<button type="button" class="btn primary" data-act="new-inv">'+icon('plus',16)+'Add item</button></div>'+

function invListHtml(list){if(!list.length)return '<div class="empty"><strong>No items</strong>Add what you keep at home so HomeHub can tell you when it runs low.</div>';
 return '<ul class="list">'+list.map(function(it){var e=expInfo(it),st=stepOf(it.unit);

  '<div class="qty-ctl"><button type="button" class="stepbtn" data-act="inv-adj" data-id="'+it.id+'" data-s="-'+st+'" data-k="used" aria-label="Used '+st+' '+esc(it.unit)+' of '+esc(it.name)+'">'+icon('minus',16)+'</button><span class="qty mono">'+fq(it.qty)+'<small>'+esc(it.unit)+'</small></span><button type="button" class="stepbtn" data-act="inv-adj" data-id="'+it.id+'" data-s="'+st+'" data-k="bought" aria-label="Bought '+st+' '+esc(it.unit)+' of '+esc(it.name)+'">'+icon('plus',16)+'</button></div></div></li>'}).join('')+'</ul>'}
function viewSupplies(){if(!canSupplies())return '<div class="panel"><div class="empty"><strong>Supplies are turned off</strong>An administrator can turn them on in Household.</div></div>';
 var t=UI.sup;if(!P('inv'))t='shop';
 var h='<div class="stack">';
 if(P('inv'))h+='<div>'+seg([['shop','Shopping list',S.groceries.filter(function(g){return g.status==='open'}).length],['inv','Inventory',S.inventory.filter(isLow).length]],'sup-tab',t)+'</div>';

 '<dl class="kv"><dt>In stock</dt><dd class="mono">'+fq(it.qty)+' '+esc(it.unit)+'</dd><dt>Minimum</dt><dd class="mono">'+fq(it.min)+' '+esc(it.unit)+'</dd></dl>'+

/* ---------- bills & jars ---------- */
function billById(id){return S.bills.filter(function(x){return x.id===id})[0]}
function jarById(id){return S.jars.filter(function(x){return x.id===id})[0]}
function bState(b){var t=todayS();return b.dueDate<t?'over':b.dueDate===t?'today':'later'}
function billRow(b){var st=bState(b),r=b.resp?mb(b.resp):null;
 return '<li><div class="bill"><button type="button" class="task-main" data-act="open-bill" data-id="'+b.id+'"><span class="t-title">'+esc(b.name)+'</span><span class="t-meta"><span class="chip mono '+(st==='over'?'bad':st==='today'?'warn':'')+'">'+icon('clock',12)+esc(fmtDue({dueDate:b.dueDate,dueTime:''}))+'</span><span class="chip">'+esc(b.cat)+'</span>'+
 (b.freq!=='once'?'<span class="chip">'+icon('repeat',12)+esc(FREQ[b.freq].toLowerCase())+'</span>':'')+(r?avatar(r,20)+'<span class="hint">'+esc(first(r.name))+'</span>':'')+'</span></button>'+
 '<div class="bill-r"><span class="amt mono">'+esc(money(b.amount))+'</span>'+(P('moneyEdit')?'<button type="button" class="btn sm primary" data-act="pay-bill" data-id="'+b.id+'">Mark paid</button>':'')+'</div></div></li>'}
function billsHtml(){var open=S.bills.filter(function(b){return b.status==='open'}).sort(function(a,b){return a.dueDate<b.dueDate?-1:1}),t=todayS(),in30=ymd(addDays(new Date(),30)),ym=t.slice(0,7);
 var over=open.filter(function(b){return b.dueDate<t}),soon=open.filter(function(b){return b.dueDate>=t&&b.dueDate<=in30}),sum=function(l){return l.reduce(function(a,b){return a+Number(b.amount)},0)};
 var paidMonth=S.bills.reduce(function(a,b){return a+b.payments.filter(function(p){return p.date.slice(0,7)===ym}).reduce(function(x,p){return x+Number(p.amount)},0)},0);
 var pays=[];S.bills.forEach(function(b){b.payments.forEach(function(p){pays.push({p:p,b:b})})});pays.sort(function(a,b){return a.p.date<b.p.date?1:-1});
 var h='<div class="toolbar">'+seg([['open','Unpaid',open.length],['hist','Payment history',pays.length]],'bf',UI.bf)+(P('moneyEdit')?'<button type="button" class="btn primary" data-act="new-bill">'+icon('plus',16)+'Add bill</button>':'')+'</div>';
 h+='<section class="panel" style="margin-bottom:16px"><div class="sumrow"><div><div class="hint">Overdue</div><div class="sumv mono '+(over.length?'bad':'')+'">'+esc(money(sum(over)))+'</div></div><div><div class="hint">Due in 30 days</div><div class="sumv mono">'+esc(money(sum(soon)))+'</div></div><div><div class="hint">Paid this month</div><div class="sumv mono">'+esc(money(paidMonth))+'</div></div></div></section>';
 if(UI.bf==='hist'){return h+'<section class="panel">'+(pays.length?'<ul class="list">'+pays.slice(0,40).map(function(x){var m=mb(x.p.by);return '<li><div class="act">'+avatar(m,24)+'<span>'+esc(x.b.name)+' <span class="hint">paid by '+esc(m?first(m.name):'someone')+'</span></span><span class="when mono">'+esc(money(x.p.amount))+' · '+esc(fmtDue({dueDate:x.p.date,dueTime:''}))+'</span></div></li>'}).join('')+'</ul>':'<div class="empty"><strong>No payments yet</strong>Mark a bill as paid to start the history.</div>')+'</section>'}
 h+='<section class="panel">';
 if(!open.length)h+='<div class="empty"><strong>No unpaid bills</strong>Record electricity, water, internet and other household bills to get reminders.</div>';
 else{var g={over:[],week:[],later:[]},w=ymd(addDays(new Date(),7));open.forEach(function(b){(b.dueDate<t?g.over:b.dueDate<=w?g.week:g.later).push(b)});
  [['over','Overdue'],['week','Next 7 days'],['later','Later']].forEach(function(k){if(g[k[0]].length)h+='<div class="group-h">'+k[1]+'</div><ul class="list">'+g[k[0]].map(billRow).join('')+'</ul>'})}
 return h+'</section>'}
function jarTotal(j){return j.contribs.reduce(function(a,c){return a+Number(c.amount)},0)}
function jarPaid(j,mid){return j.contribs.filter(function(c){return c.by===mid}).reduce(function(a,c){return a+Number(c.amount)},0)}
function bar(p,label){return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(p*100)+'" aria-label="'+esc(label)+'"><span style="width:'+Math.round(p*100)+'%"></span></div>'}
function jarDeadline(j){if(!j.deadline)return '';var d=Math.round((parseD(j.deadline)-startOfDay(new Date()))/864e5);return d<0?'<span class="chip bad">Deadline passed</span>':d===0?'<span class="chip warn">Due today</span>':'<span class="chip '+(d<=7?'warn':'')+'">'+d+' day'+(d===1?'':'s')+' left</span>'}
function jarsHtml(){var act=S.jars.filter(function(j){return j.status==='active'}),done=S.jars.filter(function(j){return j.status==='complete'});
 var h='<div class="toolbar"><span class="hint">Jars track who has contributed. HomeHub does not move money.</span>'+(P('moneyEdit')?'<button type="button" class="btn primary" data-act="new-jar">'+icon('plus',16)+'New money jar</button>':'')+'</div>';

 '<ul class="list">'+Object.keys(j.shares).map(function(id){var m=mb(id);if(!m)return '';var paid=jarPaid(j,id),sh=j.shares[id],full=paid>=sh;

 '<div class="row">'+(j.status==='active'&&P('contribute')?'<button type="button" class="btn primary sm" data-act="contribute" data-id="'+j.id+'">Add contribution</button>':'')+'<button type="button" class="btn sm" data-act="open-jar" data-id="'+j.id+'">Details</button></div></section>'}

 return '<div class="stack"><div>'+seg([['bills','Bills',S.bills.filter(function(b){return b.status==='open'}).length],['jars','Money jars',S.jars.filter(function(j){return j.status==='active'}).length]],'money-tab',UI.money)+'</div>'+(UI.money==='jars'?jarsHtml():billsHtml())+'</div>'}

 if(kind==='inv'){var n=(fd.get('name')||'').trim(),q=parseFloat(fd.get('qty')),mn=parseFloat(fd.get('min'));
  if(!n)return fail('Enter the item name.'),true;if(!(q>=0))return fail('Enter how much is in stock.'),true;if(!(mn>=0))return fail('Enter a minimum stock level, or 0.'),true;

 t=mkTask({title:title,desc:m.desc||'',assign:{mode:'members',ids:[m.assignee]},dueDate:m.scheduled||'',priority:m.prio,reminder:m.scheduled?'1440':'',createdBy:S.me,maintId:m.id,history:[{ts:Date.now(),who:S.me,text:'Created from maintenance'}]});S.tasks.push(t);m.taskId=t.id;
 if(m.assignee!==S.me)notify(m.assignee,first(me().name)+' assigned you: '+title,'care',m.id)}
function p3MaintDone(m,fromTask){if(m.status==='done')return;m.status='done';m.doneAt=Date.now();m.doneBy=S.me;m.history.push({ts:Date.now(),who:S.me,text:'Marked fixed'});logAct(first(me().name)+' fixed “'+m.title+'”');
 var t=m.taskId?tk(m.taskId):null;if(!fromTask&&t&&t.status==='open'){t.status='done';t.completedAt=Date.now();t.completedBy=S.me;hist(t,'Marked done (maintenance fixed)')}
 if(m.every>0){var base=m.scheduled&&m.scheduled>todayS()?m.scheduled:todayS(),nd=parseD(base);nd.setMonth(nd.getMonth()+m.every);
  var nm=Object.assign({},m,{id:uid(),status:'scheduled',scheduled:ymd(nd),taskId:'',doneAt:0,doneBy:null,created:Date.now(),history:[{ts:Date.now(),who:S.me,text:'Scheduled automatically after the last service'}]});S.maint.push(nm);p3MaintTask(nm,'')}}
function p3TaskDone(t){if(t.maintId){var m=byId(S.maint,t.maintId);if(m)p3MaintDone(m,true)}}
function p3TaskDeleted(t){if(t.cleanId&&t.occ){var c=byId(S.cleaning,t.cleanId);if(c){c.skip=c.skip||[];c.skip.push(t.occ)}}}

/* ---------- meals ---------- */
function slotName(s){return SLOTS.filter(function(x){return x[0]===s})[0][1]}
function slotIx(s){for(var i=0;i<SLOTS.length;i++)if(SLOTS[i][0]===s)return i;return 0}
function parseIngs(txt){return String(txt||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){var p=l.split(',').map(function(x){return x.trim()}),q=parseFloat(p[1]);return {name:p[0],qty:isNaN(q)?0:q,unit:p[2]||''}}).filter(function(i){return i.name})}
function fmtIngs(a){return a.map(function(i){return i.name+(i.qty?', '+fq(i.qty)+(i.unit?', '+i.unit:''):'')}).join('\n')}
function ingStatus(g){var inv=S.inventory.filter(function(i){return i.name.toLowerCase()===g.name.toLowerCase()})[0];
 if(!inv||inv.qty<=0)return {k:'miss',inv:inv,need:g.qty||1,l:'Not in stock'};
 if(g.qty>0&&(!g.unit||g.unit===inv.unit)&&inv.qty<g.qty)return {k:'low',inv:inv,need:Math.round((g.qty-inv.qty)*100)/100,l:'Only '+fq(inv.qty)+' '+inv.unit+' in stock'};
 return {k:'ok',inv:inv,need:0,l:'In stock'}}
function missingCount(m){return m.ings.filter(function(g){return ingStatus(g).k!=='ok'}).length}
function mealStart(){return UI.mealWeek?parseD(UI.mealWeek):startOfDay(new Date())}
function cookChip(m){var c=mb(m.cook);return c?avatar(c,20)+'<span class="hint">'+esc(first(c.name))+' is cooking</span>':'<span class="chip warn">Needs a cook</span>'}
function mealRow(m){var by=mb(m.by),adm=P('mealEdit'),sg=m.status==='suggested';
 return '<div class="slot"><span class="sl">'+slotName(m.slot)+'</span><button type="button" class="task-main" data-act="open-meal" data-id="'+m.id+'" style="flex:1;min-width:170px"><span class="t-title">'+esc(m.title)+'</span><span class="t-meta">'+(sg?'<span class="chip accent">Suggested by '+esc(by?first(by.name):'someone')+'</span>':cookChip(m))+
  (canSupplies()&&m.ings.length&&!sg?(missingCount(m)?'<span class="chip warn">'+missingCount(m)+' to buy</span>':'<span class="chip good">All in stock</span>'):'')+'</span></button>'+
  (sg&&adm?'<span class="row" style="gap:6px"><button type="button" class="btn sm primary" data-act="approve-meal" data-id="'+m.id+'">Add to plan</button><button type="button" class="btn sm" data-act="decline-meal" data-id="'+m.id+'">Decline</button></span>':'')+
  (!sg&&!m.cook&&P('claimCook')?'<button type="button" class="btn sm" data-act="claim-cook" data-id="'+m.id+'">I’ll cook</button>':'')+'</div>'}
function viewMeals(){if(!canMeals())return '<div class="panel"><div class="empty"><strong>Meal planning is turned off</strong>An administrator can turn it on in Household.</div></div>';
 var st=mealStart(),en=addDays(st,6),h='<div class="stack">';
 h+='<div class="cal-bar"><div class="row" style="gap:6px"><button type="button" class="iconbtn" data-act="meal-nav" data-t="-1" aria-label="Previous week">'+icon('chevL')+'</button><button type="button" class="btn" data-act="meal-nav" data-t="0">Today</button><button type="button" class="iconbtn" data-act="meal-nav" data-t="1" aria-label="Next week">'+icon('chevR')+'</button></div><h2 class="cal-title">'+esc(st.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' – '+en.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}))+'</h2><button type="button" class="btn primary" data-act="new-meal" data-d="">'+icon('plus',16)+(P('mealEdit')?'Plan a meal':'Suggest a meal')+'</button></div>';
 for(var i=0;i<7;i++){var ds=ymd(addDays(st,i)),ms=S.meals.filter(function(m){return m.date===ds}).sort(function(a,b){return slotIx(a.slot)-slotIx(b.slot)}),rows='';
  SLOTS.forEach(function(sl){var l=ms.filter(function(m){return m.slot===sl[0]});if(l.length)rows+=l.map(mealRow).join('');else if(sl[0]==='dinner')rows+='<div class="slot"><span class="sl">Dinner</span><span class="hint">Nothing planned</span></div>'});
  h+='<section class="panel'+(ds===todayS()?' is-today':'')+'"><div class="panel-h"><h2>'+esc(dayLabel(ds))+'</h2><button type="button" class="link" data-act="new-meal" data-d="'+ds+'">'+(P('mealEdit')?'Add':'Suggest')+'</button></div>'+rows+'</section>'}
 return h+'</div>'}

 '<dl class="kv"><dt>Cook</dt><dd>'+(mb(m.cook)?esc(mb(m.cook).name):'Nobody yet')+'</dd>'+(src?'<dt>From</dt><dd>Suggestion: '+esc(src.title)+'</dd>':'')+'</dl>'+(m.notes?'<div class="group-h" style="margin-top:16px">Recipe and notes</div><p style="white-space:pre-wrap">'+esc(m.notes)+'</p>':'');

 else h+='<ul class="list">'+m.ings.map(function(g){var s=canSupplies()?ingStatus(g):null;return '<li><div class="act"><span>'+esc(g.name)+(g.qty?' <span class="hint mono">'+fq(g.qty)+(g.unit?' '+esc(g.unit):'')+'</span>':'')+'</span><span class="when">'+(s?'<span class="chip '+(s.k==='ok'?'good':'warn')+'">'+esc(s.l)+'</span>':'')+'</span></div></li>'}).join('')+'</ul>';
 h+='<div class="sheet-actions">'+(canEdit?'<button type="button" class="btn danger" data-act="delete-meal" data-id="'+id+'" style="margin-right:auto">'+(UI.confirm==='delml'+id?'Tap again to delete':'Delete')+'</button><button type="button" class="btn" data-act="edit-meal" data-id="'+id+'">'+icon('edit',16)+'Edit</button>':'')+

 return h}
function mealForm(id,ds){var m=id?byId(S.meals,id):{title:'',date:ds||todayS(),slot:'dinner',cook:'',notes:'',ings:[]},adm=P('mealEdit');

/* ---------- suggestions ---------- */
function votesOf(s){var u=0,d=0;Object.keys(s.votes).forEach(function(k){if(mb(k)){if(s.votes[k]==='up')u++;else d++}});return {u:u,d:d}}
function catName(k){var c=SCATS.filter(function(x){return x[0]===k})[0];return c?c[1]:'Something else'}
function sugChips(s){return '<span class="chip">'+esc(catName(s.cat))+'</span>'+(s.cat==='purchase'&&s.amount>0?'<span class="chip mono">'+esc(money(s.amount))+'</span>':'')+(s.status!=='pending'?'<span class="chip '+(s.status==='rejected'?'bad':'good')+'">'+SSTAT[s.status]+'</span>':'')+(s.converted?'<span class="chip accent">'+esc(s.converted.label)+'</span>':'')}
function voteBtns(s){var v=votesOf(s),mine=s.votes[S.me],can=P('vote')&&s.status==='pending';
 return '<div class="row" style="gap:6px"><button type="button" class="btn sm" data-act="vote" data-id="'+s.id+'" data-v="up" aria-pressed="'+(mine==='up')+'"'+(can?'':' disabled')+'>'+icon('up',14)+'Support <span class="mono">'+v.u+'</span></button><button type="button" class="btn sm" data-act="vote" data-id="'+s.id+'" data-v="down" aria-pressed="'+(mine==='down')+'"'+(can?'':' disabled')+'>'+icon('down',14)+'Oppose <span class="mono">'+v.d+'</span></button></div>'}
function voteBar(s){var v=votesOf(s),t=v.u+v.d;if(!t)return '';return '<div class="votebar" aria-hidden="true"><span class="up" style="width:'+(v.u/t*100)+'%"></span><span class="down" style="width:'+(v.d/t*100)+'%"></span></div>'}
function sugCard(s){var by=mb(s.by),v=votesOf(s);
 return '<section class="panel jar"><div><div class="row" style="gap:6px;margin-bottom:6px">'+sugChips(s)+(s.status==='pending'&&v.u>v.d&&v.u>=2?'<span class="chip good">Majority support</span>':'')+'</div><h2 style="font-size:18px">'+esc(s.title)+'</h2></div>'+(s.desc?'<p class="hint clamp">'+esc(s.desc)+'</p>':'')+
 '<div class="row hint" style="gap:8px">'+avatar(by,20)+'<span>'+esc(by?first(by.name):'Someone')+' · '+ago(s.created)+'</span></div>'+voteBar(s)+
 '<div class="row" style="justify-content:space-between">'+voteBtns(s)+'<button type="button" class="btn sm" data-act="open-sug" data-id="'+s.id+'">'+icon('chat',14)+(s.comments.length?s.comments.length+' comment'+(s.comments.length===1?'':'s'):'Discuss')+'</button></div></section>'}
function ideasHtml(){var f=UI.sugf,cnt=function(k){return S.suggestions.filter(function(s){return s.status===k}).length};
 var list=S.suggestions.filter(function(s){return s.status===f}).sort(function(a,b){return b.created-a.created});
 return '<div class="toolbar">'+seg([['pending','Open',cnt('pending')],['accepted','Accepted',cnt('accepted')],['completed','Completed',cnt('completed')],['rejected','Declined',cnt('rejected')]],'sugf',f)+(P('suggest')?'<button type="button" class="btn primary" data-act="new-sug">'+icon('plus',16)+'New suggestion</button>':'')+'</div>'+
 (list.length?'<div class="grid cols2">'+list.map(sugCard).join('')+'</div>':'<section class="panel"><div class="empty"><strong>'+(f==='pending'?'No open suggestions':'Nothing here yet')+'</strong>'+(f==='pending'?'Propose a dinner, a purchase, a repair or a new household rule and let everyone vote.':'Suggestions appear here once an administrator decides on them.')+'</div></section>')}

 return mHead(s.title)+'<div class="row" style="margin-bottom:12px">'+sugChips(s)+'</div>'+(s.desc?'<p style="margin-bottom:12px">'+esc(s.desc)+'</p>':'')+
 '<dl class="kv"><dt>Suggested by</dt><dd>'+esc(by?by.name:'Someone')+' · '+esc(fmtTs(s.created))+'</dd><dt>Support</dt><dd>'+esc(names('up'))+'</dd><dt>Oppose</dt><dd>'+esc(names('down'))+'</dd></dl>'+
 '<div style="margin-top:14px">'+voteBar(s)+'<div style="margin-top:8px">'+voteBtns(s)+'</div></div>'+
 '<div class="group-h" style="margin-top:18px">Comments</div>'+(s.comments.length?s.comments.map(function(c){var m=mb(c.by);return '<div class="cm"><div class="row hint" style="gap:8px">'+avatar(m,20)+'<span>'+esc(m?first(m.name):'Someone')+' · '+ago(c.ts)+'</span></div><p>'+esc(c.text)+'</p></div>'}).join(''):'<p class="hint">No comments yet.</p>')+
 (P('vote')?'<form class="row" data-form="sug-comment" data-id="'+id+'" style="margin-top:8px;align-items:flex-end"><div class="field" style="flex:1;min-width:180px"><label for="cm-t" class="sr">Comment</label><input id="cm-t" name="text" type="text" maxlength="300" placeholder="Add a comment"></div><button class="btn sm" type="submit">Post</button></form>':'')+
 (dec?'<div class="sheet-actions">'+(s.status==='pending'?'<button type="button" class="btn danger" data-act="sug-status" data-id="'+id+'" data-s="rejected">Decline</button><button type="button" class="btn primary" data-act="sug-status" data-id="'+id+'" data-s="accepted">Accept</button>':

  '<p class="hint" style="margin-top:14px">An administrator decides on suggestions. Turning one into a bill, a task or a money jar also needs an administrator.</p>')}

/* ---------- tick ---------- */
function p3Tick(n){var changed=p3GenClean();
 S.events.forEach(function(e){var key=e.date+(e.time||'');if(e.reminder===''||e.reminder==null||e.remKey===key)return;
  var st=new Date(e.date+'T'+(e.time||'09:00')),at=new Date(st.getTime()-Number(e.reminder)*6e4);
  if(n>=at&&n<new Date(st.getTime()+864e5)){e.remKey=key;changed=true;var txt=e.title+(st<n?' is happening now':' starts '+fmtDue({dueDate:e.date,dueTime:e.time}).toLowerCase());
   e.people.forEach(function(i){notify(i,txt,'event',e.id)});if(e.people.indexOf(S.me)>-1&&me().prefs.events!==false)toast(txt,'Open',function(){openEvent(e.id)})}});
 S.meals.forEach(function(m){if(m.status!=='planned'||!m.cook||m.remKey===m.date||m.date!==todayS())return;var at=new Date(m.date+'T'+SLOTTIME[m.slot]);
  if(n>=at){m.remKey=m.date;changed=true;var txt='You are cooking '+slotName(m.slot).toLowerCase()+': '+m.title;notify(m.cook,txt,'care',m.id);if(m.cook===S.me&&me().prefs.care!==false)toast(txt,'Open',function(){openMeal(m.id)})}});
 return changed}

function p3Submit(kind,fd,id){
 if(kind==='event'){var title=(fd.get('title')||'').trim(),date=fd.get('date'),time=fd.get('time')||'',end=fd.get('endTime')||'',people=fd.getAll('people');
  if(!title)return fail('Give the event a title.'),true;if(!date)return fail('Choose a date.'),true;if(end&&!time)return fail('Add a start time to use an end time.'),true;if(end&&end<=time)return fail('The end time must be after the start time.'),true;if(!people.length)return fail('Invite at least one person.'),true;
  var data={title:title,desc:(fd.get('desc')||'').trim(),date:date,time:time,endTime:end,place:(fd.get('place')||'').trim(),kind:fd.get('kind'),people:people,reminder:fd.get('reminder'),budget:parseFloat(fd.get('budget'))||0,jarId:fd.get('jarId')||''};
  var txt=function(e){return data.kind==='info'?'Notice: '+title+', '+evWhen(e):first(me().name)+' invited you to '+title+' ('+EKINDS[data.kind].toLowerCase()+', '+evWhen(e)+')'};
  if(id){var e=byId(S.events,id);if(!e)return true;var old=e.people.slice(),moved=e.date!==date||e.time!==time||String(e.reminder)!==String(data.reminder);if(!canMoney()){delete data.budget;delete data.jarId}Object.assign(e,data);if(moved)e.remKey='';
   Object.keys(e.rsvp).forEach(function(k){if(people.indexOf(k)<0)delete e.rsvp[k]});if(data.kind==='info')e.rsvp={};
   people.filter(function(i){return old.indexOf(i)<0&&i!==S.me}).forEach(function(i){notify(i,txt(e),'event',e.id)});
   if(moved)people.filter(function(i){return old.indexOf(i)>-1&&i!==S.me}).forEach(function(i){notify(i,title+' was changed: '+evWhen(e),'event',e.id)});logAct(first(me().name)+' edited the event '+title)}
  else{var ne=Object.assign({id:uid(),rsvp:{},remKey:'',createdBy:S.me,created:Date.now(),srcSug:''},data);if(!canMoney()){ne.budget=0;ne.jarId=''}S.events.push(ne);if(data.kind!=='info'&&people.indexOf(S.me)>-1)ne.rsvp[S.me]='yes';
   people.filter(function(i){return i!==S.me}).forEach(function(i){notify(i,txt(ne),'event',ne.id)});logAct(first(me().name)+' added the event '+title)}
  closeModal();commit();toast(id?'Event saved':'Event added');return true}
 if(kind==='ev-job'){var ev=byId(S.events,id),jt=(fd.get('title')||'').trim();if(!ev)return true;if(!jt)return fail('Describe the job first.'),true;var who=fd.get('who');
  var t=mkTask({title:jt,desc:'For '+ev.title,assign:who?{mode:'members',ids:[who]}:{mode:'claimable',ids:[]},dueDate:ev.date,dueTime:ev.time||'',priority:'med',reminder:'60',createdBy:S.me,eventId:ev.id,history:[{ts:Date.now(),who:S.me,text:'Created for event '+ev.title}]});S.tasks.push(t);
  if(who&&who!==S.me)notify(who,first(me().name)+' gave you a job for '+ev.title+': '+jt,'task',t.id);logAct(first(me().name)+' added the job “'+jt+'” for '+ev.title);commit();return true}
 if(kind==='ev-shop'){var ev2=byId(S.events,id),nm=(fd.get('name')||'').trim(),q=parseFloat(fd.get('qty'));if(!ev2)return true;if(!nm)return fail('Enter the item name.'),true;
